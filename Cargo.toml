[package]
name = "corporate-contacts"
version = "1.0.0"
edition = "2021"
description = "Корпоративный телефонный справочник контактов"
authors = ["Даниил Суханов <https://github.com/daniilsukhanoff-hub>"]
repository = "https://github.com/daniilsukhanoff-hub/corporate-contacts"
homepage = "https://github.com/daniilsukhanoff-hub/corporate-contacts"
license = "MIT"

[dependencies]
gtk = { package = "gtk4", version = "0.9", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.7", features = ["v1_4", "v1_5"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "5.0"
gio = "0.20"
glib = "0.20"
gdk = { package = "gdk4", version = "0.9" }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
